# =============================================================================
# Production stack — single VM behind an nginx reverse proxy.
#
# SECRET POLICY: containers receive ONLY Infisical bootstrap credentials via
# .env.prod. NODE_ENV=production activates Infisical-only mode inside both
# apps (packages/infisical-config): DATABASE_URL, REDIS_URL, JWT secrets, etc.
# are fetched at boot and must exist in the Infisical 'prod' environment.
# Ensure .env.prod is 600 (enforced by scripts/deploy.sh).
#
# NETWORK POLICY: only nginx publishes ports. The internal network is NOT
# flagged `internal: true` on purpose — server and fiscal-engine need outbound
# HTTPS (Infisical, DIAN providers, Firebase). Isolation comes from having no
# published ports on any backend service.
#
# IMAGE PINS: digests recommended for reproducibility. Run
#   docker pull <image> && docker inspect --format '{{.RepoDigests}}' <image>
# and pin via `image: nginx:1.27-alpine@sha256:...`. Current tags use
# --pull on build to get latest patches; pin when you need hermetic prod.
# =============================================================================

name: pharmacy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - DAC_OVERRIDE
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=64m

services:
  nginx:
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-api.example.com}
      DOMAIN_API: ${DOMAIN_API:-${DOMAIN:-api.example.com}}
      DOMAIN_BACKOFFICE: ${DOMAIN_BACKOFFICE:-admin.example.com}
      DOMAIN_LANDING: ${DOMAIN_LANDING:-www.example.com}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [edge, internal]
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=32m
      - /var/run:noexec,nosuid,size=8m
      - /tmp:noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot certificate issuance/renewal; driven by scripts/deploy.sh init
  # and a host cron (`deploy.sh renew-certs`). Not started with the stack.
  certbot:
    image: certbot/certbot:latest@sha256:d07bd043d61d6bee1114235ac12c2e9a5c54b6931b3ccf5e1174d6c8c4afaa95
    profiles: ["certbot"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
      - /var/log/letsencrypt:noexec,nosuid,size=16m

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: server
    image: pharmacy/server:local
    restart: unless-stopped
    init: true
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server-storage:/data
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    <<: *default-hardening
    networks: [internal]
    mem_limit: 768m
    logging: *default-logging

  # Run explicitly: docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: migrator
    image: pharmacy/migrator:local
    profiles: ["tools"]
    restart: "no"
    init: true
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  fiscal-engine:
    build:
      context: .
      dockerfile: docker/fiscal-engine.Dockerfile
      target: fiscal
    image: pharmacy/fiscal-engine:local
    restart: unless-stopped
    init: true
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    <<: *default-hardening
    networks: [internal]
    mem_limit: 512m
    logging: *default-logging

  # --- Frontend SPAs (static, served by nginx) ---
  # Built as separate nginx images; nginx reverse-proxies to them.
  # Comment out if you serve frontends externally (CDN/Vercel).
  web-backoffice:
    build:
      context: .
      dockerfile: docker/web-backoffice.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${DOMAIN_API:-${DOMAIN:-api.example.com}}}
        VITE_LANDING_URL: ${VITE_LANDING_URL:-https://${DOMAIN_LANDING:-www.example.com}}
    image: pharmacy/web-backoffice:local
    restart: unless-stopped
    init: true
    networks: [internal]
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=16m
      - /var/run:noexec,nosuid,size=8m
      - /tmp:noexec,nosuid,size=16m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-landing:
    build:
      context: .
      dockerfile: docker/web-landing.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${DOMAIN_API:-${DOMAIN:-api.example.com}}}
    image: pharmacy/web-landing:local
    restart: unless-stopped
    init: true
    networks: [internal]
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=16m
      - /var/run:noexec,nosuid,size=8m
      - /tmp:noexec,nosuid,size=16m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    restart: unless-stopped
    # shared_preload_libraries enables pg_stat_statements (created by the
    # 20260825 ops-tuning migration) for slow-query monitoring.
    command:
      - 'postgres'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'track_io_timing=on'
    environment:
      POSTGRES_USER: pharmacy_app
      POSTGRES_DB: pharmacy_prod_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Bogota
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy_app -d pharmacy_prod_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    restart: unless-stopped
    # AOF persistence: BullMQ jobs (DIAN transmission retries) must survive
    # container restarts.
    command: >
      sh -c 'exec redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes'
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    mem_limit: 256m
    logging: *default-logging

networks:
  edge:
  internal:

volumes:
  postgres-data:
    name: pharmacy-postgres-prod-data
  redis-data:
    name: pharmacy-redis-prod-data
  server-storage:
    name: pharmacy-server-storage
  certbot-conf:
    name: pharmacy-certbot-conf
  certbot-www:
    name: pharmacy-certbot-www

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
